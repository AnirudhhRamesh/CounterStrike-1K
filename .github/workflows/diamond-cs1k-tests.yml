name: DIAMOND CounterStrike-1K tests

on:
  pull_request:
    paths:
      - ".github/workflows/diamond-cs1k-tests.yml"
      - "cs2_train/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diamond-cs1k-tests.yml"
      - "cs2_train/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: diamond-cs1k-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python 3.12 unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked training and evaluation environment
        run: uv sync --frozen --extra train --extra eval

      - name: Run the release tests
        run: uv run --frozen --with pytest==9.1.1 pytest -q cs2_train/tests
